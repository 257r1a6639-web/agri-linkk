<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apartment Dashboard - AGRI LINKK</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f7f5;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #198754, #0d6efd);
            color: white;
            padding: 35px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            color: #198754;
            font-weight: bold;
        }

        .product-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .grade-a {
            background-color: #198754;
            color: white;
        }

        .grade-b {
            background-color: #ffc107;
            color: black;
        }

        .grade-c {
            background-color: #dc3545;
            color: white;
        }

        .info-box {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
        }

        .price {
            color: #198754;
            font-size: 20px;
            font-weight: bold;
        }

        .product-description {
            overflow-wrap: anywhere;
        }

        .loading-container {
            padding: 35px;
            text-align: center;
        }

        .table-responsive {
            overflow-x: auto;
        }

        #messageBox {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                🌾 AGRI LINKK
            </a>

            <button
                class="btn btn-light btn-sm"
                type="button"
                onclick="logout()"
            >
                Logout
            </button>
        </div>
    </nav>

    <main class="container mt-4 mb-5">

        <!-- DASHBOARD HEADER -->
        <div class="dashboard-header">
            <h2>
                Welcome,
                <span id="apartmentName">Apartment</span>
                🏢
            </h2>

            <p class="mb-0">
                Get fresh agricultural products directly from farmers for your apartment community.
            </p>
        </div>

        <!-- APARTMENT PROFILE -->
        <div class="card p-4 mb-4">
            <h4 class="section-title mb-3">
                🏢 Apartment Profile
            </h4>

            <div class="row">
                <div class="col-md-6">
                    <p>
                        <strong>Name:</strong>
                        <span id="profileName">-</span>
                    </p>

                    <p>
                        <strong>Email:</strong>
                        <span id="profileEmail">-</span>
                    </p>
                </div>

                <div class="col-md-6">
                    <p>
                        <strong>Phone:</strong>
                        <span id="profilePhone">-</span>
                    </p>

                    <p>
                        <strong>Role:</strong>
                        <span id="profileRole">-</span>
                    </p>
                </div>
            </div>
        </div>

        <!-- MARKETPLACE -->
        <div class="card p-4 mb-4">

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                <h4 class="section-title mb-0">
                    🥕 Fresh Farmer Products
                </h4>

                <button
                    id="refreshButton"
                    class="btn btn-success"
                    type="button"
                    onclick="loadProducts()"
                >
                    🔄 Refresh
                </button>
            </div>

            <div
                id="messageBox"
                class="alert alert-info"
                role="status"
            >
                Loading products...
            </div>

            <div
                class="row g-4"
                id="productsContainer"
            ></div>

        </div>

    </main>

    <script>
        // BACKEND URL
        const API_URL = "https://agri-linkk-api.onrender.com";

        // LOGIN DATA
        const token = localStorage.getItem("agrilinkkToken");
        const userData = localStorage.getItem("agrilinkkUser");

        let user = null;
        let productsLoading = false;
        let sessionInvalid = false;

        // LOGIN CHECK
        if (!token || !userData) {
            alert("Please login first.");
            window.location.replace("login.html");
        } else {
            try {
                user = JSON.parse(userData);

                if (!user || typeof user !== "object") {
                    throw new Error("Invalid user data.");
                }
            } catch (error) {
                localStorage.removeItem("agrilinkkToken");
                localStorage.removeItem("agrilinkkUser");

                alert("Your login session is invalid. Please login again.");
                window.location.replace("login.html");
            }
        }

        // ROLE CHECK
        if (user && user.role !== "Apartment") {
            alert("Access denied. Apartment account required.");
            window.location.replace("login.html");
        }

        // DISPLAY USER INFORMATION
        if (user && user.role === "Apartment") {
            document.getElementById("apartmentName").textContent =
                user.full_name || "Apartment";

            document.getElementById("profileName").textContent =
                user.full_name || "-";

            document.getElementById("profileEmail").textContent =
                user.email || "-";

            document.getElementById("profilePhone").textContent =
                user.phone || "-";

            document.getElementById("profileRole").textContent =
                user.role || "-";
        }

        // API REQUEST
        async function apiRequest(endpoint) {
            const response = await fetch(API_URL + endpoint, {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token,
                    "Accept": "application/json"
                }
            });

            let data;

            try {
                data = await response.json();
            } catch (error) {
                throw new Error("The server returned an invalid response.");
            }

            if (response.status === 401 || response.status === 403) {
                sessionInvalid = true;

                alert(
                    data.message ||
                    "Your session has expired or you do not have permission."
                );

                logout();

                throw new Error("Authentication failed.");
            }

            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Request failed with status " + response.status
                );
            }

            return data;
        }

        // LOAD PRODUCTS
        async function loadProducts() {
            if (
                productsLoading ||
                sessionInvalid ||
                !token ||
                !user ||
                user.role !== "Apartment"
            ) {
                return;
            }

            productsLoading = true;

            const container = document.getElementById("productsContainer");
            const messageBox = document.getElementById("messageBox");
            const refreshButton = document.getElementById("refreshButton");

            refreshButton.disabled = true;
            refreshButton.textContent = "Loading...";

            messageBox.className = "alert alert-info";
            messageBox.textContent = "Loading agricultural products...";

            container.innerHTML = `
                <div class="col-12 loading-container">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3 mb-0">
                        Loading agricultural products...
                    </p>
                </div>
            `;

            try {
                const data = await apiRequest("/api/market-products");

                if (data.success !== true) {
                    throw new Error(
                        data.message || "Failed to load products."
                    );
                }

                const products = Array.isArray(data.products)
                    ? data.products
                    : [];

                if (products.length === 0) {
                    messageBox.className = "alert alert-warning";
                    messageBox.textContent =
                        "No agricultural products are currently available.";

                    container.innerHTML = `
                        <div class="col-12">
                            <div class="text-center text-muted p-5">
                                <div style="font-size: 60px;">🌾</div>
                                <h5>No Products Available</h5>
                                <p>
                                    Farmers have not listed any products yet.
                                    Please check again later.
                                </p>
                            </div>
                        </div>
                    `;

                    return;
                }

                messageBox.className = "alert alert-success";
                messageBox.textContent =
                    products.length + " agricultural product(s) available.";

                container.innerHTML = products
                    .map(product => createProductCard(product))
                    .join("");

            } catch (error) {
                if (sessionInvalid) {
                    return;
                }

                console.error("Product loading error:", error);

                messageBox.className = "alert alert-danger";
                messageBox.textContent =
                    "Unable to load products. " + error.message;

                container.innerHTML = `
                    <div class="col-12">
                        <div class="text-center text-danger p-4">
                            <h5>Server Connection Error</h5>
                            <p>
                                Please check your internet connection and try again.
                                If the problem continues, the backend server or
                                product API may be unavailable.
                            </p>
                            <button
                                class="btn btn-outline-success"
                                type="button"
                                onclick="loadProducts()"
                            >
                                Try Again
                            </button>
                        </div>
                    </div>
                `;

            } finally {
                productsLoading = false;
                refreshButton.disabled = false;
                refreshButton.textContent = "🔄 Refresh";
            }
        }

        // CREATE PRODUCT CARD
        function createProductCard(product) {
            let gradeClass = "grade-c";

            const grade = String(product.grade ?? "").toUpperCase();

            if (grade === "A") {
                gradeClass = "grade-a";
            } else if (grade === "B") {
                gradeClass = "grade-b";
            }

            const farmerName = product.farmer_name || "Farmer";
            const farmerPhone = product.farmer_phone || "";

            return `
                <div class="col-md-6 col-lg-4">
                    <div class="card product-card h-100 p-3">

                        <div class="d-flex justify-content-between align-items-center gap-2">
                            <h5 class="mb-0">
                                🌱 ${escapeHtml(product.product_name || "Unnamed Product")}
                            </h5>

                            <span class="badge ${gradeClass}">
                                ${grade ? "Grade " + escapeHtml(grade) : "Grade N/A"}
                            </span>
                        </div>

                        <hr>

                        <div class="info-box mb-3">
                            <strong>👨‍🌾 Farmer</strong>
                            <br>
                            ${escapeHtml(farmerName)}
                            <br>

                            <small class="text-muted">
                                📍 ${escapeHtml(
                                    product.land_location || "Location not provided"
                                )}
                            </small>
                        </div>

                        <p>
                            <strong>🌱 Crop:</strong>
                            ${escapeHtml(
                                product.crop_name || product.product_name || "-"
                            )}
                        </p>

                        <p>
                            <strong>🌿 Farming Type:</strong>
                            ${escapeHtml(product.farming_type || "Not specified")}
                        </p>

                        <p>
                            <strong>📦 Available Quantity:</strong>
                            ${escapeHtml(product.quantity ?? "-")} Kg
                        </p>

                        <p>
                            <strong>💰 Price:</strong>
                            <span class="price">
                                ₹${escapeHtml(product.price ?? "-")}
                                <small>/ Kg</small>
                            </span>
                        </p>

                        <div class="product-description mb-3">
                            <strong>📝 Description:</strong>
                            <br>
                            ${escapeHtml(
                                product.description || "No description provided"
                            )}
                        </div>

                        <hr>

                        <button
                            class="btn btn-outline-success w-100 mt-auto"
                            type="button"
                            onclick="contactFarmerByIndex(${getProductIndex(product)})"
                        >
                            📞 Contact Farmer
                        </button>

                    </div>
                </div>
            `;
        }

        // STORE PRODUCTS FOR SAFE CONTACT BUTTON HANDLING
        let currentProducts = [];

        function getProductIndex(product) {
            const index = currentProducts.indexOf(product);

            if (index !== -1) {
                return index;
            }

            currentProducts.push(product);
            return currentProducts.length - 1;
        }

        // CONTACT FARMER
        function contactFarmerByIndex(index) {
            const product = currentProducts[index];

            if (!product) {
                alert("Farmer information is unavailable.");
                return;
            }

            const farmerName = product.farmer_name || "Farmer";
            const farmerPhone = String(product.farmer_phone || "").trim();

            if (!farmerPhone) {
                alert("Farmer phone number is not available.");
                return;
            }

            const confirmed = confirm(
                "Farmer: " + farmerName +
                "\n\nPhone: " + farmerPhone +
                "\n\nDo you want to call this farmer?"
            );

            if (confirmed) {
                window.location.href = "tel:" + farmerPhone;
            }
        }

        // ESCAPE HTML
        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        // LOGOUT
        function logout() {
            localStorage.removeItem("agrilinkkToken");
            localStorage.removeItem("agrilinkkUser");
            window.location.replace("login.html");
        }

        // LOAD PRODUCTS WHEN PAGE OPENS
        if (token && user && user.role === "Apartment") {
            loadProducts();
        }
    </script>

</body>
</html>
