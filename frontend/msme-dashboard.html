<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSME Dashboard - AGRI LINKK</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7f5;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 35px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            color: #0d6efd;
            font-weight: bold;
        }

        .product-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .grade-a {
            background-color: #198754;
            color: white;
        }

        .grade-b {
            background-color: #ffc107;
            color: black;
        }

        .grade-c {
            background-color: #dc3545;
            color: white;
        }

        .farmer-info {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            color: #198754;
        }

        .quantity {
            font-weight: bold;
            color: #0d6efd;
        }

        .product-card p {
            overflow-wrap: anywhere;
        }

        @media (max-width: 576px) {
            .dashboard-header {
                padding: 22px;
            }

            .dashboard-header h2 {
                font-size: 1.5rem;
            }

            .refresh-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">🌾 AGRI LINKK</a>
        <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container mt-4">

    <!-- DASHBOARD HEADER -->
    <div class="dashboard-header">
        <h2>Welcome, <span id="msmeName">MSME</span> 🏢</h2>
        <p class="mb-0">
            Discover fresh agricultural products directly from farmers.
        </p>
    </div>

    <!-- PROFILE -->
    <div class="card p-4 mb-4">
        <h4 class="section-title mb-3">👤 MSME Profile</h4>

        <div class="row">
            <div class="col-md-6">
                <p><strong>Name:</strong> <span id="profileName">Not provided</span></p>
                <p><strong>Email:</strong> <span id="profileEmail">Not provided</span></p>
            </div>

            <div class="col-md-6">
                <p><strong>Phone:</strong> <span id="profilePhone">Not provided</span></p>
                <p><strong>Role:</strong> <span id="profileRole">MSME</span></p>
            </div>
        </div>
    </div>

    <!-- MARKETPLACE -->
    <div class="card p-4 mb-5">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
            <h4 class="section-title mb-0">🥕 Agricultural Marketplace</h4>

            <button
                class="btn btn-primary refresh-button"
                id="refreshButton"
                type="button"
                onclick="loadProducts()"
            >
                🔄 Refresh
            </button>
        </div>

        <div class="alert alert-info" id="productCount" role="status" aria-live="polite">
            Loading products...
        </div>

        <div class="row g-4" id="productsContainer"></div>
    </div>

</div>

<script>
"use strict";

// ========================================
// BACKEND CONFIGURATION
// ========================================

const API_BASE_URL = "https://agri-linkk-api.onrender.com";

// ========================================
// LOGIN INFORMATION
// ========================================

const token = localStorage.getItem("agrilinkkToken");
const userData = localStorage.getItem("agrilinkkUser");

let user = null;
let sessionValid = false;

// ========================================
// LOGIN AND ROLE CHECK
// ========================================

if (!token || !userData) {
    alert("Please login first.");
    window.location.href = "login.html";
} else {
    try {
        user = JSON.parse(userData);

        if (!user || typeof user !== "object") {
            throw new Error("Invalid user information.");
        }

        if (
            user.role &&
            String(user.role).toLowerCase() !== "msme"
        ) {
            alert("Access denied. MSME account required.");
            window.location.href = "login.html";
        } else {
            sessionValid = true;
        }
    } catch (error) {
        localStorage.removeItem("agrilinkkToken");
        localStorage.removeItem("agrilinkkUser");

        alert("Your login information is invalid. Please log in again.");
        window.location.href = "login.html";
    }
}

// ========================================
// DISPLAY USER INFORMATION
// ========================================

if (sessionValid && user) {
    document.getElementById("msmeName").textContent =
        user.full_name || user.name || "MSME";

    document.getElementById("profileName").textContent =
        user.full_name || user.name || "Not provided";

    document.getElementById("profileEmail").textContent =
        user.email || "Not provided";

    document.getElementById("profilePhone").textContent =
        user.phone || user.phone_number || "Not provided";

    document.getElementById("profileRole").textContent =
        user.role || "MSME";
}

// ========================================
// LOAD MARKET PRODUCTS
// Requires GET /api/market-products on backend.
// ========================================

async function loadProducts() {
    const container = document.getElementById("productsContainer");
    const countBox = document.getElementById("productCount");
    const refreshButton = document.getElementById("refreshButton");

    container.replaceChildren();

    countBox.className = "alert alert-info";
    countBox.textContent = "Loading agricultural products...";
    refreshButton.disabled = true;

    const loadingColumn = document.createElement("div");
    loadingColumn.className = "col-12 text-center p-4";

    loadingColumn.innerHTML = `
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Loading agricultural products...</p>
    `;

    container.appendChild(loadingColumn);

    try {
        const response = await fetch(
            `${API_BASE_URL}/api/market-products`,
            {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/json"
                }
            }
        );

        const data = await response.json().catch(() => ({}));

        if (response.status === 401 || response.status === 403) {
            alert(
                data.message ||
                "Your session has expired. Please log in again."
            );

            logout();
            return;
        }

        if (!response.ok) {
            throw new Error(
                data.message ||
                `The server returned status ${response.status}.`
            );
        }

        if (data.success === false) {
            throw new Error(data.message || "Failed to load products.");
        }

        // Accept common API response formats.
        let products = [];

        if (Array.isArray(data)) {
            products = data;
        } else if (Array.isArray(data.products)) {
            products = data.products;
        } else if (Array.isArray(data.data)) {
            products = data.data;
        } else {
            throw new Error(
                "The server response does not contain a product list. Check your backend API."
            );
        }

        container.replaceChildren();

        if (products.length === 0) {
            countBox.className = "alert alert-warning";
            countBox.textContent =
                "No agricultural products are currently available.";

            const emptyColumn = document.createElement("div");
            emptyColumn.className = "col-12";

            const emptyState = document.createElement("div");
            emptyState.className = "text-center text-muted p-5";

            const icon = document.createElement("div");
            icon.style.fontSize = "60px";
            icon.textContent = "🌾";

            const heading = document.createElement("h5");
            heading.textContent = "No Products Available";

            const description = document.createElement("p");
            description.textContent =
                "Farmers have not listed any products yet.";

            emptyState.append(icon, heading, description);
            emptyColumn.appendChild(emptyState);
            container.appendChild(emptyColumn);

            return;
        }

        countBox.className = "alert alert-success";
        countBox.textContent =
            `${products.length} agricultural product(s) available`;

        products.forEach(product => {
            container.appendChild(createProductCard(product));
        });

    } catch (error) {
        console.error("Product loading error:", error);

        container.replaceChildren();

        countBox.className = "alert alert-danger";
        countBox.textContent =
            "Unable to load products. Please check your connection and try again.";

        const errorColumn = document.createElement("div");
        errorColumn.className = "col-12";

        const errorState = document.createElement("div");
        errorState.className = "text-center text-danger p-4";

        const heading = document.createElement("h5");
        heading.textContent = "Marketplace Connection Error";

        const description = document.createElement("p");
        description.className = "text-muted";
        description.textContent =
            error.message ||
            "Check that the Render backend is running and the marketplace endpoint exists.";

        const retryButton = document.createElement("button");
        retryButton.type = "button";
        retryButton.className = "btn btn-outline-primary";
        retryButton.textContent = "Try Again";
        retryButton.addEventListener("click", loadProducts);

        errorState.append(heading, description, retryButton);
        errorColumn.appendChild(errorState);
        container.appendChild(errorColumn);

    } finally {
        refreshButton.disabled = false;
    }
}

// ========================================
// CREATE PRODUCT CARD
// ========================================

function createProductCard(product) {
    const column = document.createElement("div");
    column.className = "col-md-6 col-lg-4";

    const card = document.createElement("div");
    card.className = "card product-card h-100 p-3";

    const grade = String(product.grade || "C").toUpperCase();

    let gradeClass = "grade-c";

    if (grade === "A") {
        gradeClass = "grade-a";
    } else if (grade === "B") {
        gradeClass = "grade-b";
    }

    // Product title and grade
    const header = document.createElement("div");
    header.className =
        "d-flex justify-content-between align-items-center gap-2";

    const title = document.createElement("h5");
    title.className = "mb-0";
    title.textContent =
        `🌱 ${product.product_name || product.crop_name || "Unnamed Product"}`;

    const gradeBadge = document.createElement("span");
    gradeBadge.className = `badge ${gradeClass}`;
    gradeBadge.textContent = `Grade ${grade}`;

    header.append(title, gradeBadge);
    card.appendChild(header);
    card.appendChild(document.createElement("hr"));

    // Farmer information
    const farmerInfo = document.createElement("div");
    farmerInfo.className = "farmer-info mb-3";

    const farmerHeading = document.createElement("strong");
    farmerHeading.textContent = "👨‍🌾 Farmer";

    const farmerName = document.createElement("div");
    farmerName.textContent =
        product.farmer_name || "Farmer name not provided";

    const farmerLocation = document.createElement("small");
    farmerLocation.className = "text-muted";
    farmerLocation.textContent =
        `📍 ${product.land_location || product.location || "Location not provided"}`;

    farmerInfo.append(farmerHeading, farmerName, farmerLocation);
    card.appendChild(farmerInfo);

    addDetail(card, "🌱 Crop:", product.crop_name || product.product_name || "Not provided");
    addDetail(card, "🌿 Farming Type:", product.farming_type || "Not specified");
    addDetail(card, "📦 Available Quantity:", `${formatNumber(product.quantity)} Kg`);

    // Price
    const priceParagraph = document.createElement("p");

    const priceLabel = document.createElement("strong");
    priceLabel.textContent = "💰 Price: ";

    const priceValue = document.createElement("span");
    priceValue.className = "price";
    priceValue.textContent = `₹${formatNumber(product.price)}`;

    const perKg = document.createElement("small");
    perKg.textContent = " / Kg";

    priceValue.appendChild(perKg);
    priceParagraph.append(priceLabel, priceValue);
    card.appendChild(priceParagraph);

    addDetail(
        card,
        "📝 Description:",
        product.description || "No description provided"
    );

    card.appendChild(document.createElement("hr"));

    // Contact farmer
    const contactButton = document.createElement("button");
    contactButton.type = "button";
    contactButton.className = "btn btn-outline-primary w-100";
    contactButton.textContent = "📞 Contact Farmer";

    contactButton.addEventListener("click", () => {
        contactFarmer(
            product.farmer_name || "Farmer",
            product.farmer_phone || product.phone || ""
        );
    });

    card.appendChild(contactButton);
    column.appendChild(card);

    return column;
}

// ========================================
// ADD PRODUCT DETAIL
// ========================================

function addDetail(card, label, value) {
    const paragraph = document.createElement("p");
    paragraph.className = "mb-2";

    const labelElement = document.createElement("strong");
    labelElement.textContent = `${label} `;

    const valueElement = document.createElement("span");
    valueElement.textContent =
        value === null || value === undefined || value === ""
            ? "Not provided"
            : String(value);

    paragraph.append(labelElement, valueElement);
    card.appendChild(paragraph);
}

// ========================================
// FORMAT NUMBERS
// ========================================

function formatNumber(value) {
    const number = Number(value);

    if (!Number.isFinite(number)) {
        return "0";
    }

    return number.toLocaleString("en-IN", {
        maximumFractionDigits: 2
    });
}

// ========================================
// CONTACT FARMER
// ========================================

function contactFarmer(farmerName, farmerPhone) {
    const phone = String(farmerPhone || "").trim();

    if (!phone || phone === "undefined" || phone === "null") {
        alert("The farmer's phone number is not available.");
        return;
    }

    const confirmed = confirm(
        `Farmer: ${farmerName}\n\nPhone: ${phone}\n\nDo you want to call this farmer?`
    );

    if (confirmed) {
        window.location.href = `tel:${phone}`;
    }
}

// ========================================
// LOGOUT
// ========================================

function logout() {
    localStorage.removeItem("agrilinkkToken");
    localStorage.removeItem("agrilinkkUser");

    window.location.href = "login.html";
}

// ========================================
// INITIAL LOAD
// ========================================

if (sessionValid) {
    loadProducts();
}
</script>

</body>
</html>
