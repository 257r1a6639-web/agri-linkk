<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Dashboard - AGRI LINKK</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f7f5;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #6f42c1, #0d6efd);
            color: white;
            padding: 35px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            color: #6f42c1;
            font-weight: bold;
        }

        .product-card {
            transition: 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .grade-a {
            background-color: #198754;
            color: white;
        }

        .grade-b {
            background-color: #ffc107;
            color: black;
        }

        .grade-c {
            background-color: #dc3545;
            color: white;
        }

        .info-box {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
        }

        .price {
            color: #198754;
            font-size: 20px;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            color: #6c757d;
            padding: 40px 15px;
        }

        .empty-state-icon {
            font-size: 60px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">🌾 AGRI LINKK</a>

            <button class="btn btn-light btn-sm" onclick="logout()">
                Logout
            </button>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- HEADER -->
        <div class="dashboard-header">
            <h2>
                Welcome,
                <span id="communityName">Community</span>
                🏘️
            </h2>

            <p class="mb-0">
                Discover fresh agricultural products for your community directly from farmers.
            </p>
        </div>

        <!-- PROFILE -->
        <div class="card p-4 mb-4">
            <h4 class="section-title mb-3">🏘️ Community Profile</h4>

            <div class="row">
                <div class="col-md-6">
                    <p>
                        <strong>Name:</strong>
                        <span id="profileName"></span>
                    </p>

                    <p>
                        <strong>Email:</strong>
                        <span id="profileEmail"></span>
                    </p>
                </div>

                <div class="col-md-6">
                    <p>
                        <strong>Phone:</strong>
                        <span id="profilePhone"></span>
                    </p>

                    <p>
                        <strong>Role:</strong>
                        <span id="profileRole"></span>
                    </p>
                </div>
            </div>
        </div>

        <!-- MARKETPLACE -->
        <div class="card p-4 mb-5">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                <h4 class="section-title mb-0">
                    🥕 Fresh Agricultural Products
                </h4>

                <button
                    id="refreshButton"
                    class="btn btn-primary"
                    onclick="loadProducts()"
                >
                    🔄 Refresh
                </button>
            </div>

            <div id="messageBox" class="alert alert-info" role="status">
                Loading products...
            </div>

            <div class="row g-4" id="productsContainer"></div>
        </div>

    </div>

    <script>
        // ========================================
        // API CONFIGURATION
        // ========================================

        const API_BASE_URL = "https://agri-linkk-api.onrender.com";

        // ========================================
        // LOGIN DATA
        // ========================================

        const token = localStorage.getItem("agrilinkkToken");
        const userData = localStorage.getItem("agrilinkkUser");

        let user = null;

        // ========================================
        // LOGIN AND ROLE CHECKS
        // ========================================

        if (!token || !userData) {
            alert("Please login first.");
            window.location.href = "login.html";
        } else {
            try {
                user = JSON.parse(userData);

                if (!user || typeof user !== "object") {
                    throw new Error("Invalid user data");
                }

                if (user.role !== "Community") {
                    alert("Access denied. Community account required.");
                    window.location.href = "login.html";
                }
            } catch (error) {
                localStorage.removeItem("agrilinkkToken");
                localStorage.removeItem("agrilinkkUser");
                window.location.href = "login.html";
            }
        }

        // ========================================
        // DISPLAY USER INFORMATION
        // ========================================

        if (user && user.role === "Community") {
            document.getElementById("communityName").textContent =
                user.full_name || "Community";

            document.getElementById("profileName").textContent =
                user.full_name || "Not provided";

            document.getElementById("profileEmail").textContent =
                user.email || "Not provided";

            document.getElementById("profilePhone").textContent =
                user.phone || "Not provided";

            document.getElementById("profileRole").textContent =
                user.role || "Community";
        }

        // ========================================
        // LOAD PRODUCTS
        // ========================================

        async function loadProducts() {
            const container = document.getElementById("productsContainer");
            const messageBox = document.getElementById("messageBox");
            const refreshButton = document.getElementById("refreshButton");

            if (!token || !user || user.role !== "Community") {
                return;
            }

            refreshButton.disabled = true;

            messageBox.className = "alert alert-info";
            messageBox.textContent = "Loading agricultural products...";

            container.innerHTML = `
                <div class="col-12 text-center p-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Please wait while products are loaded.</p>
                </div>
            `;

            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/market-products`,
                    {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Accept": "application/json"
                        }
                    }
                );

                let data;

                try {
                    data = await response.json();
                } catch {
                    throw new Error("The server returned an invalid response.");
                }

                if (response.status === 401 || response.status === 403) {
                    alert(data.message || "Your session has expired. Please log in again.");
                    logout();
                    return;
                }

                if (!response.ok || !data.success) {
                    messageBox.className = "alert alert-danger";
                    messageBox.textContent =
                        data.message || "Failed to load products. Please try again.";

                    container.innerHTML = "";
                    return;
                }

                const products = Array.isArray(data.products)
                    ? data.products
                    : [];

                if (products.length === 0) {
                    messageBox.className = "alert alert-warning";
                    messageBox.textContent =
                        "No agricultural products are currently available.";

                    container.innerHTML = `
                        <div class="col-12">
                            <div class="empty-state">
                                <div class="empty-state-icon">🌾</div>
                                <h5>No Products Available</h5>
                                <p>Farmers have not listed any products yet.</p>
                            </div>
                        </div>
                    `;

                    return;
                }

                messageBox.className = "alert alert-success";
                messageBox.textContent =
                    `${products.length} agricultural product(s) available.`;

                container.innerHTML = products
                    .map((product, index) => createProductCard(product, index))
                    .join("");

            } catch (error) {
                console.error("Product loading error:", error);

                messageBox.className = "alert alert-danger";
                messageBox.textContent =
                    "Unable to load products. Please check your connection and try again.";

                container.innerHTML = `
                    <div class="col-12">
                        <div class="empty-state">
                            <div class="empty-state-icon">⚠️</div>
                            <h5>Server Connection Error</h5>
                            <p>
                                The AGRI LINKK server could not be reached,
                                or the marketplace endpoint is unavailable.
                                Please try again later.
                            </p>
                            <button class="btn btn-outline-primary" onclick="loadProducts()">
                                Try Again
                            </button>
                        </div>
                    </div>
                `;
            } finally {
                refreshButton.disabled = false;
            }
        }

        // ========================================
        // PRODUCT CARD
        // ========================================

        function createProductCard(product, index) {
            const grade = String(product.grade ?? "").toUpperCase();

            let gradeClass = "grade-c";

            if (grade === "A") {
                gradeClass = "grade-a";
            } else if (grade === "B") {
                gradeClass = "grade-b";
            }

            const productName = escapeHtml(product.product_name || "Unnamed Product");
            const farmerName = escapeHtml(product.farmer_name || "Farmer");
            const location = escapeHtml(product.land_location || "Location not provided");
            const cropName = escapeHtml(product.crop_name || product.product_name || "Not specified");
            const farmingType = escapeHtml(product.farming_type || "Not specified");
            const quantity = escapeHtml(product.quantity ?? "Not specified");
            const price = escapeHtml(product.price ?? "Not specified");
            const description = escapeHtml(
                product.description || "No description provided"
            );

            return `
                <div class="col-md-6 col-lg-4">
                    <div class="card product-card h-100 p-3">

                        <div class="d-flex justify-content-between align-items-center gap-2">
                            <h5 class="mb-0">🌱 ${productName}</h5>
                            <span class="badge ${gradeClass}">
                                Grade ${escapeHtml(grade || "N/A")}
                            </span>
                        </div>

                        <hr>

                        <div class="info-box mb-3">
                            <strong>👨‍🌾 Farmer</strong>
                            <br>
                            ${farmerName}
                            <br>
                            <small class="text-muted">
                                📍 ${location}
                            </small>
                        </div>

                        <p>
                            <strong>🌱 Crop:</strong>
                            ${cropName}
                        </p>

                        <p>
                            <strong>🌿 Farming Type:</strong>
                            ${farmingType}
                        </p>

                        <p>
                            <strong>📦 Available Quantity:</strong>
                            ${quantity} Kg
                        </p>

                        <p>
                            <strong>💰 Price:</strong>
                            <span class="price">
                                ₹${price}
                                <small>/ Kg</small>
                            </span>
                        </p>

                        <p>
                            <strong>📝 Description:</strong>
                            <br>
                            ${description}
                        </p>

                        <hr>

                        <button
                            type="button"
                            class="btn btn-outline-primary w-100"
                            onclick="contactFarmer(${index})"
                        >
                            📞 Contact Farmer
                        </button>

                    </div>
                </div>
            `;
        }

        // ========================================
        // CONTACT FARMER
        // ========================================

        function contactFarmer(index) {
            const container = document.getElementById("productsContainer");
            const cards = container.querySelectorAll(".product-card");

            // Retrieve the product from the last successfully loaded list.
            const product = currentProducts[index];

            if (!product) {
                alert("Farmer information is unavailable. Please refresh the products.");
                return;
            }

            const farmerName = product.farmer_name || "Farmer";
            const farmerPhone = String(product.farmer_phone || "").trim();

            if (!farmerPhone) {
                alert("Farmer phone number is not available.");
                return;
            }

            const confirmed = confirm(
                `Farmer: ${farmerName}\n\n` +
                `Phone: ${farmerPhone}\n\n` +
                "Do you want to call this farmer?"
            );

            if (confirmed) {
                window.location.href = `tel:${farmerPhone.replace(/[^\d+]/g, "")}`;
            }
        }

        // Stores products for safe contact-button indexing.
        let currentProducts = [];

        // ========================================
        // HTML ESCAPE
        // ========================================

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        // ========================================
        // LOGOUT
        // ========================================

        function logout() {
            localStorage.removeItem("agrilinkkToken");
            localStorage.removeItem("agrilinkkUser");
            window.location.href = "login.html";
        }

        // ========================================
        // INITIALIZE DASHBOARD
        // ========================================

        const originalCreateProductCard = createProductCard;

        // Keep the product list synchronized with the displayed cards.
        const originalLoadProducts = loadProducts;

        async function initializeProducts() {
            currentProducts = [];
            await originalLoadProducts();
        }

        // Replace the loader with one that saves the returned products.
        async function loadProductsWithStoredData() {
            await loadProducts();
        }

        loadProducts();
    </script>

</body>
</html>
